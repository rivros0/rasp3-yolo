<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Raspberry Pi YOLO Lab</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <main class="shell">
      <section class="video-panel">
        <div class="video-head">
          <div>
            <h1>YOLO Lab</h1>
            <p>Webcam realtime con riconoscimento oggetti</p>
          </div>
          <span id="status" class="status">Connessione...</span>
        </div>
        <div class="video-stage">
          <img id="stream" src="/stream.mjpg?raw=true" alt="Video della webcam" />
          <svg id="boxOverlay" class="box-overlay" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
        <p id="cameraMessage" hidden role="status">Webcam non collegata</p>
      </section>

      <aside class="side-panel">
        <section>
          <h2>Configurazione</h2>
          <label for="confidence">Confidenza minima</label>
          <div class="control-row">
            <input id="confidence" type="range" min="0.05" max="0.95" step="0.05" value="0.35" />
            <strong id="confidenceValue">0.35</strong>
          </div>
          <button id="saveConfig" type="button">Applica</button>
        </section>

        <section>
          <h2>Rilevazioni</h2>
          <ul id="detections" class="detections"></ul>
        </section>

        <section>
          <h2>API</h2>
          <a href="/docs">Documentazione interattiva</a>
          <code>/api/detections</code>
          <code>/api/frame.jpg</code>
          <code>/api/classes</code>
        </section>
      </aside>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
